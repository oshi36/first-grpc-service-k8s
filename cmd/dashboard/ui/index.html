<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gRPC on Kubernetes · live</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --panel2:#18223b; --line:#26324f;
    --text:#e8edf7; --muted:#8c99b5; --dim:#5d6a88;
    --ok:#2bd47d; --warn:#ffb020; --bad:#ff4d6d; --info:#5ab0ff;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{padding:14px 18px 18px;display:grid;gap:12px;grid-template-rows:auto auto auto 1fr;min-height:100vh}

  /* header */
  header{display:flex;align-items:center;gap:18px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:20px;letter-spacing:.2px}
  .brand span{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
  .acts{display:flex;gap:6px;margin-left:auto;margin-right:auto;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .acts button{background:transparent;border:0;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
  .acts button kbd{font-family:var(--mono);font-size:11px;color:var(--dim);margin-right:6px}
  .acts button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(43,212,125,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,212,125,0)}100%{box-shadow:0 0 0 0 rgba(43,212,125,0)}}

  .caption{background:linear-gradient(90deg,#1b2a52,#141d35);border:1px solid #2c3d6d;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center}
  .caption .tag{font-family:var(--mono);font-size:12px;color:var(--info);border:1px solid #2f4f86;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .caption .txt{font-size:17px;line-height:1.35}
  .caption .txt em{font-style:normal;color:#ffd166}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:opacity .25s, box-shadow .25s}
  .panel h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
  .dimmed .panel.dim{opacity:.28}
  .dimmed .panel.focus{box-shadow:0 0 0 2px #3b6fd8, 0 0 24px rgba(59,111,216,.25)}

  /* cluster row */
  .cluster{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px}
  .facts{display:grid;gap:7px;font-size:14px}
  .fact{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .fact .k{color:var(--muted);white-space:nowrap}
  .pill{font-family:var(--mono);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1f6b46;background:#0f2a1f}
  .pill.warn{color:var(--warn);border-color:#6b5320;background:#2a2210}
  .pill.bad{color:var(--bad);border-color:#7a2a3a;background:#2c1119}
  .pill.info{color:var(--info);border-color:#2f4f86;background:#11203a}
  .controls{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600}
  .btn:hover{border-color:#3b6fd8}
  .btn.primary{background:#1d3a78;border-color:#3b6fd8}
  .btn:disabled{opacity:.45;cursor:default}
  .scale{display:flex;align-items:center;gap:6px}
  .scale b{font-family:var(--mono);font-size:18px;min-width:22px;text-align:center}

  .pods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start}
  .pod{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;overflow:hidden;transition:transform .3s, opacity .3s}
  .pod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .pod .sfx{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--c)}
  .pod .full{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}
  .pod .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .pod .kill{position:absolute;top:7px;right:8px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--dim);font-size:13px;padding:1px 6px}
  .pod .kill:hover{color:var(--bad);border-color:#7a2a3a}
  .pod.term{opacity:.5}
  .pod.new{animation:pop .6s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .restarts.bad{color:var(--bad);font-weight:700}
  .empty{color:var(--dim);font-style:italic;padding:16px 0}

  /* lanes */
  .lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .lane{min-width:0}
  .lane .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .lane .title{font-size:17px;font-weight:700}
  .lane .sub{color:var(--muted);font-size:13px}
  .path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0 10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .path span{background:#0e1528;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .path i{font-style:normal;color:var(--dim)}
  .verdict{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .verdict .big{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
  .verdict .of{color:var(--muted);font-size:14px}
  .bars{display:grid;gap:6px;min-height:120px}
  .bar{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
  .bar .name{color:var(--c);font-weight:700}
  .bar .track{display:block;height:18px;background:#0e1528;border-radius:5px;overflow:hidden;border:1px solid #1d2742}
  .bar .fill{display:block;height:100%;background:var(--c);width:0;transition:width .45s ease}
  .bar .val{text-align:right;color:var(--text)}
  .bar.idle .val{color:var(--bad);font-weight:700}
  .bar.gone .name{text-decoration:line-through;opacity:.6}
  .lane .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .lane .foot > span:last-child{white-space:nowrap;flex-shrink:0}
  .lane .err{color:var(--bad);font-family:var(--mono);font-size:11.5px;margin-top:6px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lane .waiting{color:var(--muted);padding:26px 0;text-align:center;font-size:14px}

  /* events */
  .events{overflow:auto;max-height:240px;min-height:120px}
  .ev{display:grid;grid-template-columns:70px 54px 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed #1f2944;font-size:13px;align-items:baseline}
  .ev .t{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ev .src{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;text-align:center}
  .ev .src.k8s{color:var(--warn);background:#2a2210}
  .ev .src.app{color:var(--info);background:#11203a}
  .ev .m{font-family:var(--mono);font-size:12.5px;word-break:break-word}
  .ev .m b{color:var(--warn)}
  .ev.fresh{animation:flash 1.5s ease-out}
  @keyframes flash{from{background:#22345f}to{background:transparent}}
  .kubeerr{color:var(--bad);font-family:var(--mono);font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}

  @media (max-width:1100px){.lanes{grid-template-columns:1fr}.cluster{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brand"><b>gRPC on Kubernetes</b><span id="ns">namespace: …</span></div>
    <nav class="acts" id="acts"></nav>
    <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">connecting…</span></div>
  </header>

  <div class="caption"><span class="tag" id="capTag">OVERVIEW</span><span class="txt" id="capTxt"></span></div>

  <div class="cluster">
    <section class="panel" data-act="1,2,4">
      <h2>Deployment</h2>
      <div class="facts">
        <div class="fact"><span class="k">Ready replicas</span><span class="pill" id="fReady">–</span></div>
        <div class="fact"><span class="k">Readiness probe</span><span class="pill" id="fRead">–</span></div>
        <div class="fact"><span class="k">Liveness probe</span><span class="pill" id="fLive">–</span></div>
        <div class="fact"><span class="k">MaxConnectionAge</span><span class="pill" id="fAge">–</span></div>
      </div>
      <div class="controls">
        <div class="scale"><button class="btn" id="minus">−</button><b id="rep">–</b><button class="btn" id="plus">+</button><span class="k" style="color:var(--muted);font-size:12px">replicas</span></div>
      </div>
      <div class="controls">
        <button class="btn" id="ageBtn">Set MaxConnectionAge 15s</button>
        <button class="btn" id="resetBtn" title="r">Reset</button>
      </div>
      <div class="kubeerr" id="kubeErr"></div>
    </section>
    <section class="panel" data-act="1,2,4">
      <h2>Pods <span class="hint">color = pod · ✕ deletes the pod</span></h2>
      <div class="pods" id="pods"></div>
    </section>
  </div>

  <div class="lanes" id="lanes"></div>

  <section class="panel" data-act="2,4">
    <h2>What just happened <span class="hint">Kubernetes Warning events + dashboard narration</span></h2>
    <div class="events" id="events"></div>
  </section>
</div>

<script>
const ACTS = [
  {tag:"OVERVIEW", txt:"Every reply carries the <em>name of the pod</em> that served it. Three clients send the same traffic three different ways; watch where it lands."},
  {tag:"ACT 1 · PACKAGE", txt:"One small distroless image, non-root with a <em>numeric UID</em>. The same image runs the server, the CLI client and this dashboard."},
  {tag:"ACT 2 · HEALTH", txt:"<em>httpGet</em> speaks HTTP/1.1, and gRPC answers only HTTP/2, so the probe fails and the pod restarts. Native <em>grpc</em> probes: readiness = can I serve? liveness = am I alive? <em>Not-Ready pods get no traffic.</em>", lanes:["clusterip","headless"]},
  {tag:"ACT 3 · ROUTE", txt:"<em>GRPCRoute</em> matches on gRPC service and method, with no annotations. Envoy speaks HTTP/2 end to end.", lanes:["gateway"]},
  {tag:"ACT 4 · BALANCE", txt:"kube-proxy balances <em>connections</em>; gRPC sends every RPC over <em>one</em> connection. Fix: client-side round_robin, or an L7 proxy that balances <em>per request</em>.", lanes:["clusterip","headless","gateway"]},
];
const COLORS = ["#4cc9f0","#ff5d8f","#ffd166","#06d6a0","#b388ff","#ff8c42","#9be564","#f4a6ff","#7aa2ff","#ffe066"];
const colorOf = {}; let nextColor = 0;
function color(name){ if(!(name in colorOf)) colorOf[name] = COLORS[nextColor++ % COLORS.length]; return colorOf[name]; }
const sfx = n => n.split("-").pop();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let act = 0, state = null, seenPods = new Set(), seenEvents = new Set();

// ---- act tabs ---------------------------------------------------------------
function renderActs(){
  $("acts").innerHTML = ["Overview","Package","Health","Route","Balance"].map((n,i)=>
    `<button class="${i===act?'on':''}" data-i="${i}"><kbd>${i}</kbd>${n}</button>`).join("");
  $("capTag").textContent = ACTS[act].tag; $("capTxt").innerHTML = ACTS[act].txt;
  const app = $("app"); app.classList.toggle("dimmed", act>0);
  document.querySelectorAll("[data-act]").forEach(p=>{
    const on = p.dataset.act.split(",").includes(String(act));
    p.classList.toggle("dim", act>0 && !on); p.classList.toggle("focus", act>0 && on);
  });
  document.querySelectorAll(".lane").forEach(p=>{
    const on = (ACTS[act].lanes || []).includes(p.dataset.lane);
    p.classList.toggle("dim", act>0 && !on); p.classList.toggle("focus", act>0 && on);
  });
}
$("acts").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ act=+b.dataset.i; renderActs(); }});
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(/^[0-4]$/.test(e.key)){ act=+e.key; renderActs(); }
  if(e.key==="r") post("/api/reset");
});

// ---- actions ----------------------------------------------------------------
async function post(url){
  const r = await fetch(url,{method:"POST"});
  if(!r.ok){ const t = await r.text(); $("kubeErr").textContent = "action failed: " + t.slice(0,200); }
}
$("minus").onclick = ()=> state && post(`/api/scale?replicas=${Math.max(1,state.deploy.replicas-1)}`);
$("plus").onclick  = ()=> state && post(`/api/scale?replicas=${Math.min(8,state.deploy.replicas+1)}`);
$("ageBtn").onclick = ()=> state && post(`/api/connage?value=${state.deploy.maxConnAge ? "off" : "15s"}`);
$("resetBtn").onclick = ()=> post("/api/reset");
document.addEventListener("click", e=>{
  const k = e.target.closest("[data-kill]"); if(k){ post(`/api/kill?pod=${encodeURIComponent(k.dataset.kill)}`); }
  const l = e.target.closest("[data-lane-act]"); if(l){ post(`/api/lane?id=${l.dataset.id}&action=${l.dataset.laneAct}`); }
});

// ---- render -----------------------------------------------------------------
function probePill(kind){
  if(kind==="grpc") return ["ok","grpc ✓"];
  if(kind==="httpGet") return ["bad","httpGet ✗"];
  if(kind==="tcpSocket") return ["warn","tcpSocket ~"];
  if(kind==="none") return ["warn","none"];
  return ["info",kind];
}
function setPill(el,[cls,txt]){ el.className = "pill " + cls; el.textContent = txt; }

function renderDeploy(s){
  const d = s.deploy;
  $("ns").textContent = `namespace: ${s.namespace}`;
  if(!d.found){ setPill($("fReady"),["warn","not deployed"]); setPill($("fRead"),["","–"]); setPill($("fLive"),["","–"]); setPill($("fAge"),["","–"]); $("rep").textContent="–"; return; }
  setPill($("fReady"), [d.ready===d.replicas && d.replicas>0 ? "ok" : (d.ready===0 ? "bad":"warn"), `${d.ready} / ${d.replicas}`]);
  setPill($("fRead"), probePill(d.readiness));
  setPill($("fLive"), probePill(d.liveness));
  setPill($("fAge"), d.maxConnAge ? ["ok", d.maxConnAge] : ["warn","off"]);
  $("rep").textContent = d.replicas;
  $("ageBtn").textContent = d.maxConnAge ? "Turn MaxConnectionAge off" : "Set MaxConnectionAge 15s";
  $("kubeErr").textContent = s.kubeErr ? "Kubernetes API: " + s.kubeErr.slice(0,160) : "";
}

function statusPill(p){
  if(p.status==="Ready") return ["ok","Ready"];
  if(p.status==="Terminating") return ["", "Terminating"];
  if(p.status==="NotReady") return ["warn","Not ready"];
  if(/CrashLoop|Error|BackOff/.test(p.status)) return ["bad",p.status.replace("CrashLoopBackOff","CrashLoop")];
  return ["info",p.status];
}
function renderPods(s){
  const el = $("pods");
  if(!s.pods || !s.pods.length){ el.innerHTML = `<div class="empty">No greeter pods yet. Run <code>make act2-wrong</code> or <code>make act2-fix</code>.</div>`; return; }
  el.innerHTML = s.pods.map(p=>{
    const [cls,txt] = statusPill(p); const fresh = !seenPods.has(p.name);
    return `<div class="pod ${p.status==='Terminating'?'term':''} ${fresh?'new':''}" style="--c:${color(p.name)}">
      <button class="kill" data-kill="${esc(p.name)}" title="delete pod">✕</button>
      <div class="sfx">${esc(sfx(p.name))}</div>
      <div class="full">${esc(p.name)}</div>
      <div class="row"><span class="pill ${cls}">${esc(txt)}</span>
        <span class="meta" title="restarts">↻ <span class="restarts ${p.restarts>0?'bad':''}">${p.restarts}</span></span></div>
      <div class="row"><span class="meta">${esc(p.ip||"no IP")}</span><span class="meta">${esc((p.node||"").replace("grpc-demo-",""))}</span></div>
    </div>`;
  }).join("");
  s.pods.forEach(p=>seenPods.add(p.name));
}

function verdict(l, readyPods){
  const serving = l.pods.filter(p=>p.rps>=0.4).length;
  if(l.status==="paused") return {big:"—", of:"paused", pill:["","paused"]};
  if(l.status==="waiting") return {big:"—", of:"", pill:["info","waiting for Gateway"]};
  if(l.status==="failing" || (l.rps===0 && l.errRps>0)) return {big:"0", of:`/ ${readyPods} pods serving`, pill:["bad","no healthy endpoints"]};
  let pill = ["ok","balanced ✓"];
  if(readyPods>1 && serving===1) pill = ["bad","1 pod does all the work"];
  else if(serving < readyPods) pill = ["warn", `${readyPods-serving} pod${readyPods-serving>1?'s':''} idle`];
  return {big:String(serving), of:`/ ${readyPods} pods serving`, pill};
}

function laneShell(l){
  const div = document.createElement("section");
  div.className = "panel lane"; div.dataset.lane = l.id;
  div.innerHTML = `<div class="head"><div><div class="title">${esc(l.title)}</div><div class="sub">${esc(l.subtitle)}</div></div><span class="pill" data-k="pill"></span></div>
    <div class="path">${l.path.map(esc).map(x=>`<span>${x}</span>`).join("<i>→</i>")}</div>
    <div class="verdict"><span class="big" data-k="big"></span><span class="of" data-k="of"></span></div>
    <div class="bars" data-k="bars"></div>
    <div class="err" data-k="err"></div>
    <div class="foot"><span data-k="rate"></span><span>
      <button class="btn" data-lane-act="reconnect" data-id="${l.id}" title="close and re-dial the connection">Reconnect</button>
      <button class="btn" data-lane-act="pause" data-id="${l.id}" data-k="pause">Pause</button></span></div>`;
  return div;
}
function renderLanes(s){
  const host = $("lanes");
  const readyPods = (s.pods||[]).filter(p=>p.ready).length;
  s.lanes.forEach(l=>{
    let el = host.querySelector(`[data-lane="${l.id}"]`);
    if(!el){ el = laneShell(l); host.appendChild(el); renderActs(); }
    const q = k => el.querySelector(`[data-k="${k}"]`);
    const v = verdict(l, readyPods);
    q("big").textContent = v.big; q("of").textContent = v.of; setPill(q("pill"), v.pill);
    q("big").style.color = v.pill[0]==="bad" ? "var(--bad)" : v.pill[0]==="warn" ? "var(--warn)" : v.pill[0]==="ok" ? "var(--ok)" : "var(--text)";
    const live = new Set((s.pods||[]).map(p=>p.name));
    if(l.status==="waiting"){
      q("bars").innerHTML = `<div class="waiting">No Gateway yet. Apply <code>04-gateway.yaml</code> + <code>05-grpcroute.yaml</code> (make act3)</div>`;
    } else {
      const total = Math.max(l.rps, 0.0001);
      q("bars").innerHTML = l.pods.filter(p=>live.has(p.name) || p.rps>0).map(p=>{
        const pct = Math.round(100*p.rps/total);
        const idle = live.has(p.name) && p.rps<0.4 && l.rps>0;
        return `<div class="bar ${idle?'idle':''} ${!live.has(p.name)?'gone':''}" style="--c:${color(p.name)}">
          <span class="name">${esc(sfx(p.name))}</span>
          <span class="track"><span class="fill" style="width:${l.rps>0?pct:0}%"></span></span>
          <span class="val">${p.rps.toFixed(1)}/s</span></div>`;
      }).join("") || `<div class="waiting">no pods</div>`;
    }
    q("rate").textContent = `${l.rps.toFixed(1)} rpc/s · errors ${l.errRps.toFixed(1)}/s (total ${l.totalErr})`;
    q("err").textContent = l.errRps>0 && l.lastErr ? "last error: " + l.lastErr : "";
    const pb = q("pause"); pb.dataset.laneAct = l.enabled ? "pause" : "resume"; pb.textContent = l.enabled ? "Pause" : "Resume";
  });
}

function fmtTime(t){ const d = new Date(t); return d.toLocaleTimeString([], {hour12:false}); }
function renderEvents(s){
  const el = $("events");
  if(!s.events.length){ el.innerHTML = `<div class="empty">Quiet so far.</div>`; return; }
  el.innerHTML = s.events.map(e=>{
    const key = e.time + e.msg; const fresh = !seenEvents.has(key); seenEvents.add(key);
    const msg = e.source==="k8s"
      ? `<b>${esc(e.reason)}</b> ${esc(sfx(e.object))}: ${esc(e.msg)}${e.count>1?` (×${e.count})`:""}`
      : esc(e.msg);
    return `<div class="ev ${fresh?'fresh':''}"><span class="t">${fmtTime(e.time)}</span><span class="src ${e.source}">${e.source==="k8s"?"K8S":"APP"}</span><span class="m">${msg}</span></div>`;
  }).join("");
}

function render(s){
  s.pods = s.pods || []; s.events = s.events || []; s.lanes = s.lanes || [];
  s.lanes.forEach(l=>{ l.pods = l.pods || []; });
  state = s;
  // render each area independently so one failure can never blank the rest
  for (const f of [renderDeploy, renderPods, renderLanes, renderEvents]) {
    try { f(s); } catch (e) { console.error(f.name, e); }
  }
}

// ---- live stream ------------------------------------------------------------
function connect(){
  const es = new EventSource("/api/stream");
  es.onopen = ()=>{ $("dot").classList.add("on"); $("liveTxt").textContent = "live"; };
  es.onmessage = m => render(JSON.parse(m.data));
  es.onerror = ()=>{ $("dot").classList.remove("on"); $("liveTxt").textContent = "reconnecting…"; };
}
renderActs(); connect();
</script>
