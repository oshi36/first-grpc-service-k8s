# Route by gRPC *service/method* instead of URL paths and annotations.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: greeter
  namespace: grpc-demo
spec:
  parentRefs:
    - name: grpc-gw
  hostnames:
    - greeter.demo.local
  rules:
    # The app's API
    - matches:
        - method:
            service: greeter.v1.Greeter
            # method: SayHello      # optionally pin a single method
      backendRefs:
        - name: greeter
          port: 50051
    # Reflection, so `grpcurl list` works through the gateway.
    # (Many teams deliberately DON'T expose this in prod. Nice talking point.)
    - matches:
        - method: { service: grpc.reflection.v1.ServerReflection }
        - method: { service: grpc.reflection.v1alpha.ServerReflection }
      backendRefs:
        - name: greeter
          port: 50051
